<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gracia Learning Centre | School Portal &amp; ERP (Kasarani Mwiki, Nairobi)</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="description" content="Gracia Learning Centre - Comprehensive Primary &amp; Junior School Management System, CBC Portals, and Academic Center in Kasarani Mwiki, Nairobi." />
    <meta property="og:title" content="Gracia Learning Centre | School Portal &amp; ERP" />
    <meta property="og:description" content="Gracia Learning Centre - Comprehensive Primary &amp; Junior School Management System and Academic Portals in Kasarani Mwiki, Nairobi." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1e3a8a" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Cache-Purge and Legacy Worker Cleanup Script (prevents stale blank screens on new releases) -->
    <script>
      (function() {
        // 1. Immediately purge any legacy service workers that cause blank white screens
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          }).catch(function() {});
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) {
              caches.delete(keys[i]);
            }
          }).catch(function() {});
        }

        // 2. Global listener for module load/chunk errors
        window.addEventListener('error', function(event) {
          var target = event.target || {};
          var src = target.src || target.href || '';
          var message = (event.message || '').toLowerCase();
          
          if (
            (src && src.indexOf('/assets/') !== -1) ||
            message.indexOf('loading chunk') !== -1 ||
            message.indexOf('failed to fetch dynamically imported module') !== -1 ||
            message.indexOf('mime type') !== -1
          ) {
            console.warn('[GLCM Recovery] Asset or chunk load failure detected. Refreshing app...', src || message);
            var lastReload = sessionStorage.getItem('glcm_asset_reload_timestamp');
            var now = Date.now();
            if (!lastReload || now - parseInt(lastReload, 10) > 8000) {
              sessionStorage.setItem('glcm_asset_reload_timestamp', now.toString());
              window.location.reload(true);
            }
          }
        }, true);
      })();
    </script>
    <script src="/registerSW.js" defer></script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-900 selection:text-white">
    <div id="root">
      <!-- Fallback display container: Instant visual feedback to prevent blank screens -->
      <div id="app-initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #ffffff; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; text-align: center;">
        <div style="background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 32px 24px; max-width: 380px; width: 100%; box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5); backdrop-filter: blur(12px);">
          <div style="width: 68px; height: 68px; margin: 0 auto 16px; background: linear-gradient(135deg, #1e3a8a 0%, #ea580c 100%); border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(30, 58, 138, 0.5);">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
          <h1 style="font-size: 19px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px 0; color: #ffffff;">Gracia Learning Centre</h1>
          <p style="font-size: 12px; color: #94a3b8; margin: 0 0 24px 0; font-weight: 500;">CBC Primary &amp; Junior School ERP</p>
          
          <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 18px;">
            <div style="width: 8px; height: 8px; border-radius: 50%; background: #38bdf8; animation: glcmPulse 1.4s infinite ease-in-out both;"></div>
            <div style="width: 8px; height: 8px; border-radius: 50%; background: #fb923c; animation: glcmPulse 1.4s infinite ease-in-out both 0.2s;"></div>
            <div style="width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: glcmPulse 1.4s infinite ease-in-out both 0.4s;"></div>
          </div>
          <p style="font-size: 12px; color: #cbd5e1; margin: 0 0 20px 0;">Launching secure school portals...</p>
          
          <!-- Delayed recovery button if network is slow or connection lagged -->
          <div id="slow-load-recovery" style="display: none; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.1);">
            <p style="font-size: 11px; color: #94a3b8; margin-bottom: 12px;">Taking longer than usual?</p>
            <button onclick="window.location.reload(true)" style="background: #1e3a8a; hover:background: #2563eb; color: #ffffff; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 10px 18px; font-size: 12px; font-weight: 700; cursor: pointer; width: 100%; transition: all 0.2s;">
              Refresh &amp; Reload App
            </button>
          </div>
        </div>
      </div>
      <style>
        @keyframes glcmPulse {
          0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
          40% { transform: scale(1.1); opacity: 1; }
        }
      </style>
      <script>
        // Show recovery button after 3.5s if React hasn't replaced root yet
        setTimeout(function() {
          var btn = document.getElementById('slow-load-recovery');
          if (btn) btn.style.display = 'block';
        }, 3500);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
