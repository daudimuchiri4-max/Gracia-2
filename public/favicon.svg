<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base Badge -->
  <rect width="128" height="128" rx="28" fill="url(#shieldGrad)" />
  <rect x="3" y="3" width="122" height="122" rx="25" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85" />

  <!-- School Shield Crest -->
  <path d="M 64 22 
           C 88 22, 100 28, 102 44 
           C 102 78, 84 102, 64 112 
           C 44 102, 26 78, 26 44 
           C 28 28, 40 22, 64 22 Z" 
        fill="#172554" 
        stroke="url(#goldGrad)" 
        stroke-width="3"
        filter="url(#shadow)" />

  <!-- Shield Inner Split Accent -->
  <path d="M 64 24 
           C 86 24, 98 30, 100 44 
           C 100 76, 82 99, 64 109 Z" 
        fill="url(#emeraldGrad)" 
        opacity="0.3" />

  <!-- Knowledge Book Base -->
  <path d="M 40 76 
           C 52 70, 60 72, 64 76 
           C 68 72, 76 70, 88 76 
           L 88 64 
           C 76 58, 68 60, 64 64 
           C 60 60, 52 58, 40 64 Z" 
        fill="#ffffff" 
        stroke="url(#goldGrad)" 
        stroke-width="1.5" />

  <!-- Central Flame of Excellence -->
  <path d="M 64 36 
           C 68 44, 73 48, 71 55 
           C 69 60, 65 62, 64 62 
           C 63 62, 59 60, 57 55 
           C 55 48, 60 44, 64 36 Z" 
        fill="url(#goldGrad)" />
  <path d="M 64 43 
           C 66 48, 69 51, 68 55 
           C 67 58, 65 59, 64 59 
           C 63 59, 61 58, 60 55 
           C 59 51, 62 48, 64 43 Z" 
        fill="#ffffff" />

  <!-- Laurel Wreath Leaves Left -->
  <path d="M 33 52 C 30 58, 32 66, 36 71 M 31 62 C 27 67, 30 75, 36 79 M 35 73 C 33 80, 39 87, 46 91" 
        stroke="url(#goldGrad)" 
        stroke-width="2" 
        stroke-linecap="round" 
        fill="none" />

  <!-- Laurel Wreath Leaves Right -->
  <path d="M 95 52 C 98 58, 96 66, 92 71 M 97 62 C 101 67, 98 75, 92 79 M 93 73 C 95 80, 89 87, 82 91" 
        stroke="url(#goldGrad)" 
        stroke-width="2" 
        stroke-linecap="round" 
        fill="none" />

  <!-- Academic Star Accent Top -->
  <polygon points="64,14 66.5,20 73,20.5 68,24.5 70,30.5 64,27 58,30.5 60,24.5 55,20.5 61.5,20" 
           fill="url(#goldGrad)" />
</svg>
