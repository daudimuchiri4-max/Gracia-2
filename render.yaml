# Render Blueprint Configuration for Gracia Learning Centre School ERP
services:
  # Option 1: Web Service (Node.js + Express + Vite SSR/Static fallback)
  - type: web
    name: glcm-school-erp
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
